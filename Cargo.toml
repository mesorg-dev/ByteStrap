[package]
name = "bytestrap"
version = "1.0.0"
edition = "2021"
license = "GPL-3.0"
repository = "https://github.com/mesorg-dev/ByteStrap"
description = "ByteStrap — кастомный лаунчер Roblox"

[dependencies]
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "sync",
    "time",
] }
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "stream",
    "rustls",
    "webpki-roots",
] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
dirs = "7"
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }
# Slint — единственный UI-слой (Фаза 2: egui удалён). Без фич — иначе
# unstable-winit-030 не собирается под Android (см. секцию Windows ниже).
slint = { version = "1.18", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-default",
    "renderer-femtovg",
] }

[target.'cfg(windows)'.dependencies]
rfd = "0.17"
arboard = { version = "3", default-features = false, features = ["image-data"] }
winreg = "0.55"
# Звуки интерфейса (клики, тумблеры) — WASAPI через rodio.
rodio = { version = "0.20", default-features = false, features = ["wav", "vorbis", "mp3"] }
# Локальное время для launcher.log (GetLocalTime); версия уже есть в дереве.
windows-sys = { version = "0.61", features = [
    "Win32_System_SystemInformation",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Magnification",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
] }
# Winit-доступ для frameless-окна (drag/min/max); только Windows —
# unstable-winit-030 в slint не собирается под android.
slint = { version = "1.18", default-features = false, features = [
    "std",
    "compat-1-2",
    "renderer-femtovg",
    "unstable-winit-030",
] }
tray-icon = "0.26"

[build-dependencies]
winresource = "0.1"
slint-build = { version = "1.18", default-features = false, features = ["compat-1-18"] }

[dev-dependencies]
tempfile = "3"
# Скриншоты UI без дисплея (cargo test с BYTESTRAP_SHOTS=1).
image = { version = "0.25", default-features = false, features = ["png"] }
i-slint-backend-testing = { version = "1.18", features = ["renderer-software"] }

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
