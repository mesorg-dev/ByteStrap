[package]
name = "bytestrap-chat-server"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0"
description = "Lightweight in-memory WebSocket relay for ByteStrap Roblox server chat"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
