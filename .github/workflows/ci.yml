name: ci

# Сборка + тесты на каждый push/PR в main: ловим сломанный код
# (в том числе windows-only ветки) до релиза. feat/slint-ui — чтобы
# гнать Windows-сборку и до мержа UI-ветки.
on:
  push:
    branches: [main, feat/slint-ui]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Tests
        shell: pwsh
        run: |
          cargo test --locked *>&1 | Tee-Object -FilePath test-out.txt | Write-Host
          if ($LASTEXITCODE -ne 0) {
            # Строки ошибок — в аннотации чек-рана (читаются через публичный API).
            Select-String -Path test-out.txt -Pattern 'error\[E\d+\]|^error:|panicked at|FAILED' |
              ForEach-Object { Write-Output "::error::$($_.Line)" }
            exit $LASTEXITCODE
          }

      - name: Release build (smoke)
        run: cargo build --release --locked
