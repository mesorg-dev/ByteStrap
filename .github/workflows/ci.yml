name: ci

# Сборка + тесты на каждый push/PR в main: ловим сломанный код
# (в том числе windows-only ветки) до релиза. feat/slint-ui — чтобы
# гнать Windows-сборку и до мержа UI-ветки.
on:
  push:
    branches: [main, feat/slint-ui]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Tests
        shell: pwsh
        run: |
          cargo test --locked *>&1 | Tee-Object -FilePath test-out.txt | Write-Host
          if ($LASTEXITCODE -ne 0) {
            # Ошибки компиляции — в аннотации чек-рана (публичный API):
            # каждая аннотация — заголовок ошибки + 14 строк контекста ниже.
            Select-String -Path test-out.txt -Pattern '^error(\[E\d+\])?:' -Context 0,14 |
              ForEach-Object {
                $block = $_.Line + [Environment]::NewLine +
                  ($_.Context.PostContext -join [Environment]::NewLine)
                $enc = $block.Replace('%', '%25').Replace("`r", '').
                  Replace([Environment]::NewLine, '%0A')
                Write-Output "::error::$enc"
              }
            exit $LASTEXITCODE
          }

      - name: Release build (smoke)
        run: cargo build --release --locked
